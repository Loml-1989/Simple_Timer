<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Timer - No BS</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@300;400&family=Geist:wght@400;500;600&display=swap" rel="stylesheet"></head>
<body>
    <div class="timer">
        <h1 class="display-time">00:00</h1>
        <div class="controls">
            <button class="start">Start</button>
            <button class="stop">Stop</button>
            <button class="reset">Reset</button>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
